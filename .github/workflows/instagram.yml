name: instagram

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Instagram access
        run: python3 ig.py whoami > /dev/null
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Publish due posts
        run: python3 ig.py due --yes
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Commit logs and pruned media
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "instagram: publish log"
          git pull --rebase --quiet
          git push --quiet
